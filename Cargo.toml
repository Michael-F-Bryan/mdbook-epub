[package]
authors = ["Michael Bryan <michaelfbryan@gmail.com>"]
description = "An EPUB renderer for mdbook."
name = "mdbook-epub"
version = "0.5.3"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Michael-F-Bryan/mdbook-epub"
documentation = "https://docs.rs/mdbook-epub"
keywords = ["epub", "mdbook", "documentation", "markdown"]
categories = ["command-line-interface", "development-tools"]
edition = "2024"
rust-version = "1.96"

[package.metadata.release]
sign-commit = true

[badges]
maintenance = { status = "not-actively-developed" }

[[bin]]
name = "mdbook-epub"
doc = false

[dependencies]
clap = { version = "4.6.1", default-features = false, features = [
    "derive",
    "std",
    "cargo"
] }
epub-builder = "0.8"
thiserror = "2.0"
pulldown-cmark = "0.13.4"
semver = "1.0.28"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
mime_guess = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
mdbook-core = { version = "0.5.3", default-features = false }          # I'm kinda anxious about it as they say it's for internal use, examples still outdated
mdbook-driver = { version = "0.5.3", default-features = false }        # Because we support standalone rendering...
mdbook-renderer = { version = "0.5.3", default-features = false }
handlebars = "6.4.1"# downgraded due to parent 'mdbook' dependency and error there
html_parser = "0.7.0"
url = "2.5"
ureq = "3.3"
infer = "0.19"
const_format = "0.2"

[dev-dependencies]
tempfile = "3.27"
epub = "2.1"
serial_test = "3.5"
mockall = "0.14"

[profile.release]
lto = true
#strip = true

